[package]
name = "foothold-terminal"
version = "0.1.0"
authors = ["Bryan Hyland <bryan.hyland32@gmail.com>"]
edition = "2024"
license = "MIT"

[[bin]]
name = "terminal"
path = "src/main.rs"

[dependencies]
fh-ipc = { git = "https://github.com/bhh32/foothold.git" }
fh-paths = { git = "https://github.com/bhh32/foothold.git" }
fh-plugin = { git = "https://github.com/bhh32/foothold.git" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
